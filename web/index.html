<body>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main"><div class="view" id="view"></div></main>
</div>

<div class="toasts" id="toasts"></div>

<!--
  importmap 做 cache-busting：改了任何模块只要把 BUILD 一改，所有 import
  的 URL 都变，浏览器必然重新拉取。
  ES module 有独立的模块图缓存，比 HTTP 缓存顽固得多 —— 只在 index.html 上
  挂 ?t=xxx 没用（那个查询串不会传递到 import 的模块 URL），发 no-cache
  响应头也未必穿透（实测改了 shared.js 后页面仍在跑旧版函数）。
  裸模块名走 importmap 映射，是唯一能一处改动就覆盖全部相互 import 的办法。
-->
<script type="importmap">
{
  "imports": {
    "@/shared.js":       "/static/shared.js?v=4a93351e",
    "@/router.js":       "/static/router.js?v=45447a20",
    "@/chat.js":         "/static/chat.js?v=82b5958c",
    "@/dropdown.js":     "/static/dropdown.js?v=5e8936b2",
    "@/health.js":       "/static/health.js?v=794f1767",
    "@/history.js":      "/static/history.js?v=639f6676",
    "@/overview.js":     "/static/overview.js?v=e78804b8",
    "@/pages.js":        "/static/pages.js?v=dcf6ec4b",
    "@/pool.js":         "/static/pool.js?v=cfd87d2a",
    "@/rates.js":        "/static/rates.js?v=651f700e",
    "@/selectify.js":    "/static/selectify.js?v=43162b63",
    "@/settings.js":     "/static/settings.js?v=def0937d"
  }
}
</script>
<script type="module">
  import { start } from '@/router.js';
  import { refreshIcons } from '@/shared.js';

  // 登录是独立页面 /login，不再在这里弹遮罩 —— 地址栏要如实反映「你在登录」，
  // 这样刷新、收藏、后退都符合预期，也不会出现两套登录 UI 同时存在。
  //
  // 后端访问 / 时未登录就已经 302 到 /login 了，所以正常情况走不到这里。
  // 这段是给「页面开着不动、session 过期」那种情况兜底：不做检查的话
  // 首屏每个 /api/* 都 401，用户只看到一堆报错卡片而不知道该去登录。
  const gotoLogin = () => {
    // 不要把 location.hash 编进 next：那样地址栏会变成
    // /login?next=%2F%23%2Foverview，hash 只是换了个形式照样显露出来。
    // hash 路由改由 sessionStorage 传递，登录页负责取回当落点。
    try { if (location.hash) sessionStorage.setItem('wb:carriedHash', location.hash); } catch (e) {}
    const next = encodeURIComponent(location.pathname + location.search);
    location.replace('/login?next=' + next);
  };

  (async () => {
    let st = null;
    try {
      const r = await fetch('/api/auth/state', { credentials: 'same-origin' });
      st = r.ok ? await r.json() : null;
    } catch {
      st = null;   // 后端不可达：不跳转，让页面自己显示错误态，免得陷入跳转循环
    }
    if (st && st.logged_in !== true) { gotoLogin(); return; }
    // 还在用默认密码：主界面所有 /api/* 都会被后端闸门 403，先去改密
    if (st && st.must_change_password === true) { gotoLogin(); return; }

    refreshIcons();
    start();
  })();
</script>

</body>
</html>
