<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>wb-pool 账号池网关</title>
<meta name="description" content="wb-pool 账号池网关管理后台" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<!-- ico 放在最前给旧浏览器；PNG 给现代浏览器挑更清晰的尺寸。
     图标是圆形贴边、四角透明，所以不要再加圆角或背景板。 -->
<link rel="icon" href="/static/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
<meta name="theme-color" content="#070b12" />

<link rel="preconnect" href="https://unpkg.com" />
<link rel="stylesheet" href="/static/shared.css?v=4a8191e8" />
<link rel="stylesheet" href="/static/app.css?v=42100693" />
<link rel="stylesheet" href="/static/pool.css?v=ce81ac5f" />
<link rel="stylesheet" href="/static/pages.css?v=f0473655" />
<link rel="stylesheet" href="/static/chat.css?v=ec9ef2d8" />
<link rel="stylesheet" href="/static/rates.css?v=ca3e6ec3" />
<!-- 自绘下拉组件：替代原生 select，避免系统绘制的白底展开层 -->
<link rel="stylesheet" href="/static/login.css?v=4d1291bd" />
<link rel="stylesheet" href="/static/health.css?v=9d6ac215" />
<link rel="stylesheet" href="/static/dropdown.css?v=cf99af58" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main"><div class="view" id="view"></div></main>
</div>

<div class="toasts" id="toasts"></div>

<!--
  importmap 做 cache-busting：改了任何模块只要把 BUILD 一改，所有 import
  的 URL 都变，浏览器必然重新拉取。
  ES module 有独立的模块图缓存，比 HTTP 缓存顽固得多 —— 只在 index.html 上
  挂 ?t=xxx 没用（那个查询串不会传递到 import 的模块 URL），发 no-cache
  响应头也未必穿透（实测改了 shared.js 后页面仍在跑旧版函数）。
  裸模块名走 importmap 映射，是唯一能一处改动就覆盖全部相互 import 的办法。
-->
<script type="importmap">
{
  "imports": {
    "@/shared.js":       "/static/shared.js?v=0a3e8834",
    "@/router.js":       "/static/router.js?v=64b03ec2",
    "@/chat.js":         "/static/chat.js?v=2b992240",
    "@/dropdown.js":     "/static/dropdown.js?v=5e8936b2",
    "@/health.js":       "/static/health.js?v=794f1767",
    "@/login.js":        "/static/login.js?v=75cedf7d",
    "@/overview.js":     "/static/overview.js?v=e78804b8",
    "@/pages.js":        "/static/pages.js?v=e899a51a",
    "@/pool.js":         "/static/pool.js?v=14f986c1",
    "@/rates.js":        "/static/rates.js?v=651f700e",
    "@/selectify.js":    "/static/selectify.js?v=43162b63",
    "@/settings.js":     "/static/settings.js?v=eaf81552"
  }
}
</script>
<script type="module">
  import { start } from '@/router.js';
  import { refreshIcons } from '@/shared.js';
  import { requireLogin } from '@/login.js';

  // 管理接口只认 wb_session cookie，未登录时每个 /api/* 都会 401，
  // 所以先过登录门再渲染主界面。requireLogin 内部自己处理三种情况：
  // 已登录直接放行、未登录渲染表单、后端不可达渲染可重试的错误态。
  // 它只在确认登录后才 resolve，所以这里 await 完就能安全 start()。
  (async () => {
    await requireLogin();
    refreshIcons();
    start();
  })();
</script>

</body>
</html>
