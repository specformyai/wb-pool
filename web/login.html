<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>登录 · wb-pool 账号池网关</title>
<meta name="description" content="wb-pool 账号池网关管理后台登录" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/static/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png" />

<!-- 登录页只需要变量层 + 表单样式，不拉主界面那一堆页面 CSS。
     少加载七八个文件，首屏也更快。 -->
<link rel="stylesheet" href="/static/shared.css?v=4a8191e8" />
<link rel="stylesheet" href="/static/login.css?v=4d1291bd" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<!-- 抢在渲染前抹掉继承来的 hash 路由。
     访问 /#/overview 未登录时后端 302 到 /login，Location 头是干净的
     `/login`，但浏览器按 RFC 7231 §7.1.2 会把原 URL 的 fragment 继承过来，
     地址栏就成了 /login#/overview —— 后端管不到 fragment（它从不发给服务器）。

     这段必须内联在 head 里同步执行：loginpage.js 是 type="module"，天然
     defer，等它跑起来用户已经看见那个 hash 了。落点由 loginpage.js 从
     sessionStorage 取回，登录后仍回到原本要去的页面。 -->
<script>
(function () {
  var h = location.hash || '';
  if (!h) return;
  try { sessionStorage.setItem('wb:carriedHash', h); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();
</script>
</head>
<body class="login-mode">

<div class="login-overlay" id="loginRoot"></div>
<div class="toasts" id="toasts"></div>

<script type="importmap">
{
  "imports": {
    "@/shared.js":   "/static/shared.js?v=4a93351e",
    "@/loginpage.js": "/static/loginpage.js?v=f81a073f"
  }
}
</script>
<script type="module">
  import { mountLoginPage } from '@/loginpage.js';
  mountLoginPage(document.getElementById('loginRoot'));
</script>

</body>
</html>
